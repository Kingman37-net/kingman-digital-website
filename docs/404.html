<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found | KDCN</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/images/logo-transparent.png" type="image/png">
  <link rel="stylesheet" href="/extra.css">
  <script>
    (function() {
      var path = window.location.pathname;
      if (path.endsWith('.html') && !path.endsWith('404.html')) {
        var newPath = path.replace(/\.html$/, '/');
        var query = window.location.search;
        var hash = window.location.hash;
        window.location.replace(newPath + query + hash);
      }
    })();
  </script>
  <style>
    .not-found {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 120px 5% 60px;
    }
    .not-found h1 {
      font-size: clamp(5rem, 18vw, 10rem);
      font-weight: 800;
      background: linear-gradient(90deg, var(--accent), var(--primary));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 20px;
    }
    .not-found h2 {
      font-size: clamp(1.5rem, 4vw, 2.2rem);
      margin-bottom: 16px;
    }
    .not-found p {
      color: var(--muted);
      margin-bottom: 32px;
      font-size: 1.05rem;
    }
    .not-found .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      justify-content: center;
    }
  </style>
</head>
<body>
  <nav class="site-nav">
    <div class="nav-container">
      <a href="/" class="brand" aria-label="KDCN Home">
        <img src="/images/logo-transparent.png" alt="KDCN Logo" class="brand-logo" width="40" height="40">
        <span class="brand-text">KDCN</span>
      </a>
      <ul class="nav-menu">
        <li><a href="/">Home</a></li>
        <li><a href="/about/">About</a></li>
        <li><a href="/services/">Services</a></li>
        <li><a href="/contact/">Contact</a></li>
      </ul>
    </div>
  </nav>

  <main class="not-found">
    <div>
      <h1>404</h1>
      <h2>Page Not Found</h2>
      <p>The page you're looking for doesn't exist, has been moved, or is temporarily unavailable.</p>
      <div class="actions">
        <a href="/" class="btn btn-primary">Back to Home</a>
        <a href="/contact/" class="btn btn-secondary">Contact Us</a>
      </div>
    </div>
  </main>

  <script src="/assets/kdcn-agent.js"></script>
</body>
</html>
